name: Mobile carousel QA
on:
  push:
    branches: [fix/mobile-partners-topics-exhibitors-20261008]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Unit tests and production build
        run: |
          npm test
          npm run build
        env:
          VITE_BASE_PATH: /debtupd/
      - name: Start local Vite server
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/debt-qa-vite.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/debt-qa-vite.log
          exit 1
      - name: Browser regression checks
        run: npx playwright test tests/conference-partners.spec.js tests/topics-carousel.spec.js tests/exhibitor-mobile-alignment.spec.js tests/fincifra-tariff.spec.js --reporter=line
        env:
          QA_BASE_URL: http://127.0.0.1:5173
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-mobile-qa
          path: test-results/
          retention-days: 3
