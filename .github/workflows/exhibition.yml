name: Verify exhibition test branch
on:
  push:
    branches: [test/exhibition-floorplan]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test --config=playwright.exhibition.config.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exhibition-browser-checks
          path: test-results
