name: Hero browser stability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  hero:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config=playwright.hero.config.js --project="${{ matrix.browser }}*"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hero-${{ matrix.browser }}
          path: test-results
